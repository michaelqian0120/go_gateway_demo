      summary: 首页大盘流量统计
      tags:
      - 首页大盘
  /dashboard/panel_group_data:
    get:
      consumes:
      - application/json
      description: 首页大盘统计(服务数/当日请求量/当前QPS/租户数)
      operationId: /dashboard/panel_group_data
      produces:
      - application/json
      responses:
        "200":
          description: success
