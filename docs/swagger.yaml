              type: object
      summary: 租户更新
      tags:
      - 租户管理
  /dashboard/flow_stat:
    get:
      consumes:
      - application/json
      description: 首页大盘流量统计(今日/昨日流量曲线 + 服务类型占比)
      operationId: /dashboard/flow_stat
      produces:
      - application/json
      responses:
